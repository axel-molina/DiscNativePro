name: Release Binaries

# Cada tag v* (p.ej. v1.0.0) compila las 3 plataformas y publica
# los binarios en el GitHub Release SOLO cuando todas finalicen con éxito.
# De este modo, la versión 'latest' solo se actualiza cuando todos los
# instaladores (Windows, Linux y macOS) están 100% disponibles.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install WebView2 NuGet Package
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory packages

      - name: Configure CMake
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          $projectVersion = (Select-String -Path CMakeLists.txt -Pattern 'project\(DiscNativePro VERSION ([0-9.]+)' | Select-Object -First 1).Matches.Groups[1].Value
          if ($ver -match '^([0-9]+(?:\.[0-9]+){0,2})') { $ver = $Matches[1] } else { $ver = $projectVersion }
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="$ver" -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/packages"

      - name: Build DiscNativePro (Release)
        run: |
          cmake --build build --config Release --parallel

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $exePath = Get-ChildItem -Path "build" -Filter "DiscNativePro.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exePath) {
            Write-Error "DiscNativePro.exe not found in build directory!"
            exit 1
          }
          Copy-Item $exePath -Destination "dist\DiscNativePro.exe"
          $exeDir = Split-Path -Parent $exePath
          $dllPath = Get-ChildItem -Path $exeDir -Filter "WebView2Loader.dll" | Select-Object -First 1 -ExpandProperty FullName
          if ($dllPath) {
            Copy-Item $dllPath -Destination "dist\WebView2Loader.dll"
          }

          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
            } else {
              choco install innosetup --no-progress -y
              $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
            }
          }

          $ver = "${{ github.ref_name }}"
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          $projectVersion = (Select-String -Path CMakeLists.txt -Pattern 'project\(DiscNativePro VERSION ([0-9.]+)' | Select-Object -First 1).Matches.Groups[1].Value
          if ($ver -match '^([0-9]+(?:\.[0-9]+){0,2})') { $ver = $Matches[1] } else { $ver = $projectVersion }

          iscc "/DMyAppVersion=$ver" "installer\windows\installer.iss"

      - name: Package MSIX (Microsoft Store)
        shell: pwsh
        env:
          # Identidad asignada por Partner Center para la app "DiscNativeDJ"
          # (Product identity). No cambiar sin actualizar Partner Center.
          MSIX_IDENTITY_NAME: "AXELCODE.DiscNativeDJ"
          MSIX_PUBLISHER: "CN=149C2B2A-17D9-4485-91C7-64CC91A26D35"
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Staging: ejecutable + DLL junto al manifest
          New-Item -ItemType Directory -Force -Path msix | Out-Null
          $exePath = Get-ChildItem -Path "build" -Filter "DiscNativePro.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exePath) {
            Write-Error "DiscNativePro.exe not found in build directory!"
            exit 1
          }
          Copy-Item $exePath -Destination "msix\DiscNativePro.exe"
          $exeDir = Split-Path -Parent $exePath
          $dllPath = Join-Path $exeDir "WebView2Loader.dll"
          if (Test-Path $dllPath) {
            Copy-Item $dllPath -Destination "msix\WebView2Loader.dll"
          }

          # 2. Assets visuales desde el icono de la app (44/150/50 px)
          New-Item -ItemType Directory -Force -Path msix\assets | Out-Null
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Image]::FromFile("$PWD\assets\icon.png")
          foreach ($entry in @(@{Size=44; Name="Square44x44Logo.png"}, @{Size=150; Name="Square150x150Logo.png"}, @{Size=50; Name="StoreLogo.png"})) {
            $bmp = New-Object System.Drawing.Bitmap $entry.Size, $entry.Size
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($icon, 0, 0, $entry.Size, $entry.Size)
            $g.Dispose()
            $bmp.Save("$PWD\msix\assets\$($entry.Name)", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }
          $icon.Dispose()

          # 3. Version X.Y.Z.0 desde el tag (mismo parseo que los demas pasos)
          $ver = "${{ github.ref_name }}"
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          $projectVersion = (Select-String -Path CMakeLists.txt -Pattern 'project\(DiscNativePro VERSION ([0-9.]+)' | Select-Object -First 1).Matches.Groups[1].Value
          if ($ver -match '^([0-9]+(?:\.[0-9]+){0,2})') { $ver = $Matches[1] } else { $ver = $projectVersion }
          $msixVersion = "$ver.0"

          # 4. AppxManifest (Win32 empaquetado: full trust)
          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
            <Identity Name="$env:MSIX_IDENTITY_NAME" Publisher="$env:MSIX_PUBLISHER" Version="$msixVersion" />
            <Properties>
              <DisplayName>DiscNativeDJ</DisplayName>
              <PublisherDisplayName>AXELCODE</PublisherDisplayName>
              <Logo>assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.19041.0" MaxVersionTested="10.0.26100.0" />
            </Dependencies>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Applications>
              <Application Id="App" Executable="DiscNativePro.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="DiscNativePro"
                                    Description="Native DJ software for Windows"
                                    BackgroundColor="#1a1d26"
                                    Square150x150Logo="assets\Square150x150Logo.png"
                                    Square44x44Logo="assets\Square44x44Logo.png" />
              </Application>
            </Applications>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
          </Package>
          "@
          Set-Content -Path "msix\AppxManifest.xml" -Value $manifest -Encoding utf8

          $contentTypes = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Types xmlns="http://schemas.microsoft.com/appx/2010/manifest">
            <Default Extension="png" ContentType="image/png" />
            <Default Extension="xml" ContentType="application/xml" />
          </Types>
          "@
          Set-Content -LiteralPath "msix\[Content_Types].xml" -Value $contentTypes -Encoding utf8

          # 5. Empaquetar con MakeAppx (Windows SDK del runner). Sin firma:
          # Microsoft Store re-firma el paquete al publicarlo.
          $makeAppx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makeappx.exe" -ErrorAction SilentlyContinue |
                      Where-Object { $_.DirectoryName -like "*x64" } |
                      Sort-Object FullName -Descending |
                      Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeAppx) {
            Write-Error "MakeAppx.exe not found (Windows SDK missing on runner)"
            exit 1
          }
          Write-Host "Using $makeAppx"
          & $makeAppx pack /d msix /p DiscNativePro-Windows-x64.msix
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MakeAppx pack failed (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "MSIX created: $((Get-Item DiscNativePro-Windows-x64.msix).Length) bytes"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: |
            DiscNativePro-Windows-x64-Setup.exe
            DiscNativePro-Windows-x64.msix
          if-no-files-found: error

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libcurl4-openssl-dev

      - name: Configure CMake
        run: |
          VER="${GITHUB_REF_NAME}"; VER="${VER#v}"
          PROJECT_VERSION="$(sed -nE 's/^project\(DiscNativePro VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          if [[ "$VER" =~ ^([0-9]+(\.[0-9]+){0,2}) ]]; then VER="${BASH_REMATCH[1]}"; else VER="$PROJECT_VERSION"; fi
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="$VER"

      - name: Build DiscNativePro (Release)
        run: |
          cmake --build build --config Release --parallel

      - name: Package Linux Binary (.tar.gz)
        shell: bash
        run: |
          mkdir -p dist
          find build -name "DiscNativePro" -type f -perm /111 -exec cp {} dist/ \;
          cp assets/icon.png dist/ 2>/dev/null || true
          cat << 'EOF' > dist/run.sh
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$DIR/DiscNativePro" "$@"
          EOF
          chmod +x dist/run.sh dist/DiscNativePro
          tar -czvf DiscNativePro-Linux-x64.tar.gz -C dist .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: DiscNativePro-Linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    name: macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          VER="${GITHUB_REF_NAME}"; VER="${VER#v}"
          PROJECT_VERSION="$(sed -nE 's/^project\(DiscNativePro VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          if [[ "$VER" =~ ^([0-9]+(\.[0-9]+){0,2}) ]]; then VER="${BASH_REMATCH[1]}"; else VER="$PROJECT_VERSION"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="$VER" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build DiscNativePro (Release)
        run: |
          cmake --build build --config Release --parallel

      - name: Verify universal binary (arm64 + x86_64)
        shell: bash
        run: |
          APP_PATH=$(find build -name "DiscNativePro.app" -maxdepth 4 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "DiscNativePro.app not found in build directory!"
            exit 1
          fi
          BIN="$APP_PATH/Contents/MacOS/DiscNativePro"
          ARCHS=$(lipo -archs "$BIN")
          echo "Architectures in $BIN: $ARCHS"
          for arch in arm64 x86_64; do
            if ! echo "$ARCHS" | grep -qw "$arch"; then
              echo "ERROR: missing $arch slice in the universal binary"
              exit 1
            fi
          done
          echo "OK: universal binary contains arm64 and x86_64"

      - name: Package macOS App (.zip)
        shell: bash
        run: |
          APP_PATH=$(find build -name "DiscNativePro.app" -maxdepth 4 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "DiscNativePro.app not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "Signing app bundle ad-hoc to seal resources and prevent Gatekeeper damage error..."
          codesign --force --deep --sign - "$APP_PATH"
          echo "Verifying app bundle signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          (cd "$APP_DIR" && ditto -c -k --sequesterRsrc --keepParent DiscNativePro.app "$GITHUB_WORKSPACE/DiscNativePro-macOS-Universal.zip")

      - name: Package macOS DMG (drag-to-Applications)
        shell: bash
        run: |
          APP_PATH=$(find build -name "DiscNativePro.app" -maxdepth 4 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "DiscNativePro.app not found in build directory!"
            exit 1
          fi
          cp -R "$APP_PATH" ./DiscNativePro.app
          npx -y appdmg@0.6 installer/macos/dmg.json DiscNativePro-macOS.dmg
          rm -rf ./DiscNativePro.app
          ls -lh DiscNativePro-macOS.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: |
            DiscNativePro-macOS-Universal.zip
            DiscNativePro-macOS.dmg
          if-no-files-found: error

  publish-release:
    name: Publish Official Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-artifact

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DiscNativePro-Windows-x64-Setup.exe
            DiscNativePro-Windows-x64.msix
            DiscNativePro-Linux-x64.tar.gz
            DiscNativePro-macOS-Universal.zip
            DiscNativePro-macOS.dmg
          generate_release_notes: true
