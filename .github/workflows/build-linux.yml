name: Build Linux Release (x64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x64 Native Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libcurl4-openssl-dev

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build DiscNativePro (Release)
        run: |
          cmake --build build --config Release --parallel

      - name: Package Linux Binary (.tar.gz)
        shell: bash
        run: |
          mkdir -p dist
          find build -name "DiscNativePro" -type f -perm /111 -exec cp {} dist/ \;
          # P27: el runtime ONNX vive junto al exe (post-build); sin él la app pierde stems
          find build -name "libonnxruntime.so*" -type f -exec cp {} dist/ \;
          cp assets/icon.png dist/ 2>/dev/null || true
          cat << 'EOF' > dist/run.sh
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$DIR/DiscNativePro" "$@"
          EOF
          chmod +x dist/run.sh dist/DiscNativePro
          tar -czvf DiscNativePro-Linux-x64.tar.gz -C dist .
          echo "Package created: DiscNativePro-Linux-x64.tar.gz"

      - name: Package Linux (.deb)
        shell: bash
        run: |
          cd build && cpack -G DEB
          cd ..
          find build -name "*.deb" -exec cp {} . \;
          ls -la *.deb

      - name: Upload Linux Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscNativePro-Linux-x64
          path: DiscNativePro-Linux-x64.tar.gz
          retention-days: 90

      - name: Upload Linux .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscNativePro-Linux-deb
          path: "*.deb"
          retention-days: 90
